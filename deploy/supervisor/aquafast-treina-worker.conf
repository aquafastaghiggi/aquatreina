[program:aquafast-treina-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/aquafast-treina/current/artisan queue:work database --queue=emails,default --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/aquafast-treina/shared/storage/logs/worker.log
stopwaitsecs=3600
